name: Hourly Agent Monitor

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run the script manually from the GitHub UI

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows GitHub Actions to commit changes back to repo
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-type: '3.10'

    - name: Execute Monitor Script
      run: python monitor_agents.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add agent_history.json index.html
        # Only commit if changes exist, avoiding workflow errors
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated hourly agent status update" && git push)
